name: Build IPA (unsigned)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install dependencies (XcodeGen & xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: |
          cd Portico
          xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Portico/Portico.xcodeproj -scheme Portico \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Archive (no code signing)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Portico/Portico.xcodeproj \
            -scheme Portico \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Portico.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | xcbeautify
        env:
          NSUnbufferedIO: "YES"

      - name: Package IPA
        run: |
          set -e
          APP="build/Portico.xcarchive/Products/Applications/Portico.app"
          test -d "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Portico-unsigned.ipa Payload)
          ls -lh build/Portico-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Portico-unsigned-ipa
          path: build/Portico-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

