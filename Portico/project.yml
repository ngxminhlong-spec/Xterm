name: Portico
options:
  bundleIdPrefix: com.portico
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""

packages:
  # Vendored Citadel 0.12.1 with its minimum platform lowered from iOS 17 to iOS 16.
  Citadel:
    path: Packages/Citadel
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  # Same URL and range Citadel itself depends on (a fork with RSA support); needed so
  # the app can import NIOSSH types such as the PTY request.
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    minVersion: 0.3.4
    maxVersion: 0.3.99
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3

targets:
  Portico:
    type: application
    platform: iOS
    sources:
      - path: Portico
    dependencies:
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-crypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portico.ssh
        PRODUCT_NAME: Portico
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Portico/Info.plist
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Portico/Info.plist
      properties:
        CFBundleDisplayName: Portico
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Portico uses Face ID to keep your servers and keys locked.
        NSLocalNetworkUsageDescription: Portico connects to SSH servers on your local network.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false

schemes:
  Portico:
    build:
      targets:
        Portico: all
    archive:
      config: Release
